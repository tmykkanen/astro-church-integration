name: CI
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      # Until `pnpm verify` (ticket 05): the Starter Site's type check, then the
      # build test, which builds the Starter Site and checks the Theme's route.
      - run: pnpm --filter astro-church exec tsc --noEmit
      - run: pnpm --filter playground exec astro check
      - run: node packages/astro-church/tests/build/skeleton-route.mjs

  # Packed-install harness (spec 3.1, ticket 02): packs the package, installs
  # the tarball into a copy of the Starter Site outside the workspace, then
  # runs `astro check`, `astro build` and the smoke checks. It needs no
  # workspace install.
  packed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm test:packed
