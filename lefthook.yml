# Git hooks. Installed by lefthook's postinstall on `pnpm install`
# (allowed in pnpm-workspace.yaml). Pre-push runs `pnpm verify` (ticket 05),
# the same gate every ticket must keep green.
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,mjs,cjs,json,jsonc,css,astro}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      run: pnpm verify
