# Git hooks. Installed by lefthook's postinstall on `pnpm install`
# (allowed in pnpm-workspace.yaml). Switch pre-push to `pnpm verify` once it exists
# (ticket 05). The package has no build until the CMS bundle arrives (ticket 07),
# so pre-push builds the Starter Site instead.
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,mjs,cjs,json,jsonc,css,astro}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: pnpm lint
    starter-site:
      run: pnpm --filter playground build
